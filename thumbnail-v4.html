<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Thumbnail - Afternoon Tea</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
        }

        .thumbnail {
            width: 1280px;
            height: 720px;
            position: relative;
            overflow: hidden;
            background: #2d1810;
        }

        /* Main background image - warm coffee shop vibe */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(135deg, rgba(45, 24, 16, 0.7) 0%, rgba(30, 15, 10, 0.5) 50%, rgba(20, 10, 5, 0.8) 100%),
                url('https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=1280&q=80');
            background-size: cover;
            background-position: center;
        }

        /* Subtle overlay pattern */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 30% 70%, rgba(255, 180, 100, 0.15) 0%, transparent 60%);
        }

        /* Left side - coffee cup image */
        .coffee-cup {
            position: absolute;
            bottom: -50px;
            left: -30px;
            width: 500px;
            height: 500px;
            background: 
                url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=500&q=80');
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            opacity: 0.9;
        }

        /* Right side decorative - small image */
        .deco-image {
            position: absolute;
            top: 50px;
            right: 80px;
            width: 200px;
            height: 200px;
            background: 
                url('https://images.unsplash.com/photo-1511920170033-f8396924c348?w=200&q=80');
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            transform: rotate(5deg);
        }

        /* Floating elements */
        .float-element {
            position: absolute;
            animation: gentle-float 6s ease-in-out infinite;
        }

        .feather {
            top: 100px;
            left: 400px;
            font-size: 50px;
            opacity: 0.9;
        }

        .note {
            top: 200px;
            right: 300px;
            font-size: 40px;
            opacity: 0.8;
            animation-delay: 1s;
        }

        @keyframes gentle-float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
        }

        /* Main title - clean and bold */
        .title {
            position: absolute;
            top: 50%;
            left: 55%;
            transform: translateY(-50%);
            z-index: 10;
        }

        .title h1 {
            font-size: 130px;
            font-weight: 900;
            color: #fff;
            text-shadow: 
                0 4px 20px rgba(0,0,0,0.8),
                2px 2px 0 rgba(0,0,0,0.5);
            letter-spacing: -3px;
            line-height: 0.95;
            font-family: 'Arial Black', 'Microsoft JhengHei', sans-serif;
        }

        .title .h1-second {
            display: block;
            color: #ffd700;
            text-shadow: 
                0 4px 20px rgba(255, 215, 0, 0.5),
                2px 2px 0 rgba(0,0,0,0.5);
        }

        .title .subtitle {
            font-size: 32px;
            font-weight: bold;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            letter-spacing: 12px;
            margin-top: 15px;
        }

        /* Tags */
        .tags {
            position: absolute;
            bottom: 50px;
            left: 60px;
            display: flex;
            gap: 15px;
        }

        .tag {
            background: rgba(255,255,255,0.95);
            padding: 14px 30px;
            border-radius: 30px;
            color: #2d1810;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .tag.dark {
            background: rgba(30,20,15,0.9);
            color: #ffd700;
        }

        /* AI badge */
        .ai-badge {
            position: absolute;
            top: 30px;
            left: 30px;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d2d4a 100%);
            padding: 14px 28px;
            border-radius: 30px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid rgba(255,255,255,0.2);
        }

        /* View count hint */
        .views {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        /* Play button */
        .play-btn {
            position: absolute;
            bottom: 180px;
            right: 80px;
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Gradient edge */
        .right-gradient {
            position: absolute;
            top: 0;
            right: 0;
            width: 60%;
            height: 100%;
            background: linear-gradient(to right, transparent 0%, rgba(20,10,5,0.3) 50%, rgba(20,10,5,0.9) 100%);
        }
    </style>
</head>
<body>
    <div class="thumbnail">
        <div class="bg-image"></div>
        <div class="overlay"></div>
        <div class="right-gradient"></div>
        
        <div class="coffee-cup"></div>
        
        <div class="float-element feather">🪶</div>
        <div class="float-element note">🎷</div>
        
        <div class="deco-image"></div>
        
        <div class="title">
            <h1>下午茶<span class="h1-second">時光</span></h1>
            <div class="subtitle">JAZZ · CAFE</div>
        </div>
        
        <div class="tags">
            <div class="tag">☕ 咖啡廳</div>
            <div class="tag dark">🎷 爵士樂</div>
        </div>
        
        <div class="ai-badge">✨ AI Music</div>
        <div class="views">▶ 10:00</div>
        
        <div class="play-btn">▶</div>
    </div>
</body>
</html>
