<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Thumbnail - 月映心弦</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1280px;
            height: 720px;
            background: linear-gradient(180deg, #0a0a1a 0%, #0d1a2e 40%, #152238 100%);
            position: relative;
            overflow: hidden;
            font-family: 'Noto Serif TC', 'Playfair Display', serif;
        }
        
        /* Large moon with ripple effect */
        .moon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            background: radial-gradient(circle at 35% 35%, #fffde7 0%, #ffecb3 30%, #ffd54f 60%, #ffb300 100%);
            border-radius: 50%;
            box-shadow: 
                0 0 80px rgba(255, 213, 79, 0.8),
                0 0 160px rgba(255, 213, 79, 0.5),
                0 0 280px rgba(255, 213, 79, 0.3);
            animation: moonPulse 4s ease-in-out infinite;
        }
        
        /* Moon reflection rings */
        .moon::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(255, 213, 79, 0.3);
            animation: ripple 3s ease-out infinite;
        }
        
        .moon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130%;
            height: 130%;
            border-radius: 50%;
            border: 1px solid rgba(255, 213, 79, 0.15);
            animation: ripple 3s ease-out infinite 0.5s;
        }
        
        @keyframes moonPulse {
            0%, 100% { 
                box-shadow: 0 0 80px rgba(255, 213, 79, 0.8), 0 0 160px rgba(255, 213, 79, 0.5);
                transform: translate(-50%, -50%) scale(1);
            }
            50% { 
                box-shadow: 0 0 100px rgba(255, 213, 79, 1), 0 0 200px rgba(255, 213, 79, 0.6);
                transform: translate(-50%, -50%) scale(1.02);
            }
        }
        
        @keyframes ripple {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
        }
        
        /* Water reflection */
        .water {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            background: linear-gradient(180deg, 
                rgba(13, 26, 46, 0.3) 0%, 
                rgba(21, 34, 56, 0.8) 30%,
                #0d1a2e 100%);
            overflow: hidden;
        }
        
        .water-line {
            position: absolute;
            width: 200%;
            height: 4px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 213, 79, 0.4) 50%, 
                transparent 100%);
            animation: waterMove 4s linear infinite;
        }
        
        .water-line:nth-child(1) { top: 20%; animation-delay: 0s; }
        .water-line:nth-child(2) { top: 35%; animation-delay: 1s; width: 150%; }
        .water-line:nth-child(3) { top: 50%; animation-delay: 2s; }
        .water-line:nth-child(4) { top: 65%; animation-delay: 0.5s; width: 180%; }
        
        @keyframes waterMove {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0%); }
        }
        
        /* Floating notes */
        .notes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .note {
            position: absolute;
            font-size: 32px;
            color: rgba(255, 213, 79, 0.6);
            animation: floatNote 6s ease-in-out infinite;
            text-shadow: 0 0 10px rgba(255, 213, 79, 0.5);
        }
        
        .note:nth-child(1) { top: 20%; left: 15%; animation-delay: 0s; }
        .note:nth-child(2) { top: 30%; right: 20%; animation-delay: 1s; font-size: 24px; }
        .note:nth-child(3) { top: 60%; left: 10%; animation-delay: 2s; font-size: 28px; }
        .note:nth-child(4) { top: 15%; right: 35%; animation-delay: 0.5s; }
        .note:nth-child(5) { top: 70%; right: 15%; animation-delay: 1.5s; font-size: 20px; }
        
        @keyframes floatNote {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.4; }
            50% { transform: translateY(-20px) rotate(10deg); opacity: 0.8; }
        }
        
        /* Stars */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 55%;
        }
        
        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }
        
        .star:nth-child(1) { top: 30px; left: 100px; animation-delay: 0s; }
        .star:nth-child(2) { top: 80px; left: 250px; animation-delay: 0.5s; }
        .star:nth-child(3) { top: 50px; right: 150px; animation-delay: 1s; }
        .star:nth-child(4) { top: 120px; right: 80px; animation-delay: 1.5s; width: 3px; height: 3px; }
        .star:nth-child(5) { top: 40px; right: 250px; animation-delay: 0.3s; }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }
        
        /* Title */
        .title-container {
            position: absolute;
            top: 50px;
            left: 50px;
            z-index: 10;
        }
        
        .title-main {
            display: flex;
            align-items: baseline;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .title-chinese {
            font-size: 56px;
            font-weight: 700;
            color: #fff;
            text-shadow: 
                0 0 30px rgba(255, 213, 79, 0.6),
                0 4px 12px rgba(0, 0, 0, 0.6);
            letter-spacing: 8px;
        }
        
        .title-english {
            font-size: 24px;
            font-weight: 400;
            color: #b8c4d4;
            letter-spacing: 3px;
            font-family: 'Playfair Display', serif;
        }
        
        .subtitle {
            font-size: 18px;
            color: #ffd54f;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        
        /* Category tags */
        .tags {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            gap: 10px;
        }
        
        .tag {
            padding: 6px 16px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 213, 79, 0.4);
            border-radius: 20px;
            font-size: 12px;
            color: #ffd54f;
            letter-spacing: 1px;
        }
        
        /* Duration */
        .duration {
            position: absolute;
            bottom: 30px;
            right: 30px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 6px;
            font-size: 18px;
            color: #fff;
            font-weight: 600;
            letter-spacing: 2px;
        }
        
        /* Moon symbol */
        .moon-symbol {
            position: absolute;
            bottom: 30px;
            left: 30px;
            font-size: 48px;
            filter: drop-shadow(0 0 20px rgba(255, 213, 79, 0.8));
            animation: moonSymbolGlow 3s ease-in-out infinite;
        }
        
        @keyframes moonSymbolGlow {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="stars">
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
    </div>
    
    <div class="moon"></div>
    
    <div class="water">
        <div class="water-line"></div>
        <div class="water-line"></div>
        <div class="water-line"></div>
        <div class="water-line"></div>
    </div>
    
    <div class="notes">
        <div class="note">♪</div>
        <div class="note">♫</div>
        <div class="note">♬</div>
        <div class="note">♩</div>
        <div class="note">🎵</div>
    </div>
    
    <div class="tags">
        <div class="tag">AI MUSIC</div>
        <div class="tag"> CINEMATIC</div>
    </div>
    
    <div class="title-container">
        <div class="title-main">
            <div class="title-chinese">月映心弦</div>
            <div class="title-english">Moonlit Echoes</div>
        </div>
        <div class="subtitle">Emotional Instrumental</div>
    </div>
    
    <div class="moon-symbol">🌙</div>
    
    <div class="duration">1:00:00</div>
</body>
</html>
