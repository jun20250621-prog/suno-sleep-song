<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Thumbnail - Afternoon Tea Jazz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
        }

        .thumbnail {
            width: 1280px;
            height: 720px;
            background: 
                radial-gradient(ellipse at 20% 80%, rgba(255, 180, 100, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 220, 150, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(139, 90, 43, 0.2) 0%, transparent 70%),
                linear-gradient(135deg, #1a0f0a 0%, #2d1810 50%, #1a0f0a 100%);
            position: relative;
            overflow: hidden;
        }

        /* Animated floating particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            animation: float-particle 8s ease-in-out infinite;
        }

        .p1 { width: 8px; height: 8px; background: rgba(255, 200, 100, 0.8); top: 20%; left: 10%; animation-delay: 0s; }
        .p2 { width: 12px; height: 12px; background: rgba(255, 180, 120, 0.6); top: 60%; left: 5%; animation-delay: 1s; }
        .p3 { width: 6px; height: 6px; background: rgba(255, 220, 150, 0.9); top: 30%; left: 90%; animation-delay: 2s; }
        .p4 { width: 10px; height: 10px; background: rgba(255, 200, 100, 0.7); top: 70%; left: 85%; animation-delay: 3s; }
        .p5 { width: 5px; height: 5px; background: rgba(255, 180, 120, 0.8); top: 15%; left: 60%; animation-delay: 4s; }

        @keyframes float-particle {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.8; }
            50% { transform: translateY(-30px) scale(1.2); opacity: 1; }
        }

        /* Large sun/glow effect */
        .sun-glow {
            position: absolute;
            top: -100px;
            right: -100px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 180, 80, 0.5) 0%, rgba(255, 150, 50, 0.3) 30%, transparent 70%);
            border-radius: 50%;
            filter: blur(30px);
        }

        /* Decorative frame corners */
        .corner {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 3px solid rgba(255, 200, 100, 0.3);
        }
        .corner-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .corner-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .corner-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        /* Main coffee cup - larger and more detailed */
        .cup-container {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 450px;
            height: 380px;
        }

        /* Floating coffee cup with shadow */
        .cup-main {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 280px;
            animation: cup-float 4s ease-in-out infinite;
        }

        @keyframes cup-float {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        .cup-body {
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #fff 0%, #f8f8f8 30%, #e8e0d8 100%);
            border-radius: 20px 20px 120px 120px;
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.4),
                0 15px 30px rgba(0,0,0,0.3),
                inset 0 -20px 40px rgba(139, 90, 43, 0.1);
            position: relative;
            overflow: hidden;
        }

        /* Coffee liquid surface */
        .coffee-surface {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 40px;
            background: radial-gradient(ellipse, #5d3a1a 0%, #6f4e37 50%, #4a2c1a 100%);
            border-radius: 50%;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Reflection on cup */
        .cup-reflection {
            position: absolute;
            top: 30px;
            left: 20px;
            width: 40px;
            height: 150px;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
            border-radius: 20px;
        }

        /* Cup handle */
        .cup-handle {
            position: absolute;
            top: 100px;
            right: -30px;
            width: 70px;
            height: 100px;
            border: 22px solid #fff;
            border-radius: 0 50px 50px 0;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.2);
        }

        /* Saucer */
        .saucer {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 380px;
            height: 50px;
            background: linear-gradient(180deg, #fff 0%, #f0f0f0 100%);
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Steam with better animation */
        .steam-group {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 100px;
        }

        .steam-line {
            position: absolute;
            bottom: 0;
            width: 3px;
            background: linear-gradient(to top, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
            border-radius: 50%;
            animation: steam-rise 3s ease-out infinite;
        }

        .steam-line:nth-child(1) { left: 30%; height: 60px; animation-delay: 0s; }
        .steam-line:nth-child(2) { left: 45%; height: 80px; animation-delay: 0.5s; }
        .steam-line:nth-child(3) { left: 60%; height: 50px; animation-delay: 1s; }
        .steam-line:nth-child(4) { left: 50%; height: 70px; animation-delay: 1.5s; }

        @keyframes steam-rise {
            0% { transform: translateY(0) scaleX(1); opacity: 0; }
            20% { opacity: 0.6; }
            100% { transform: translateY(-80px) scaleX(2); opacity: 0; }
        }

        /* Floating music elements */
        .music-element {
            position: absolute;
            font-size: 45px;
            animation: music-float 5s ease-in-out infinite;
            text-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .music-1 { top: 80px; left: 80px; animation-delay: 0s; transform: rotate(-15deg); }
        .music-2 { top: 150px; right: 100px; animation-delay: 1.5s; transform: rotate(10deg); }
        .music-3 { top: 50px; right: 180px; animation-delay: 2.5s; transform: rotate(-5deg); }

        @keyframes music-float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* Title with better typography */
        .title {
            position: absolute;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }

        .title h1 {
            font-size: 140px;
            font-weight: 900;
            color: #fff;
            text-shadow: 
                0 4px 0 #c9956c,
                0 8px 0 #a67c52,
                0 12px 0 #8b5a2b,
                0 20px 40px rgba(0,0,0,0.5);
            letter-spacing: -4px;
            line-height: 0.9;
            font-family: 'Arial Black', 'Microsoft JhengHei', sans-serif;
        }

        .title .subtitle {
            font-size: 36px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.5), 0 0 30px rgba(255, 215, 0, 0.3);
            letter-spacing: 15px;
            margin-top: 15px;
            font-family: 'Arial', sans-serif;
        }

        /* Tags at bottom */
        .tags {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
        }

        .tag {
            background: linear-gradient(135deg, #c9956c 0%, #8b5a2b 100%);
            padding: 15px 35px;
            border-radius: 50px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(139, 90, 43, 0.5);
            letter-spacing: 2px;
        }

        .tag.gold {
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
            color: #1a0f0a;
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.5);
        }

        /* AI badge - more prominent */
        .ai-badge {
            position: absolute;
            top: 30px;
            left: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 18px 40px;
            border-radius: 50px;
            color: white;
            font-size: 26px;
            font-weight: 900;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ai-badge::before {
            content: '✨';
            font-size: 28px;
        }

        /* Play button overlay hint */
        .play-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: white;
            backdrop-filter: blur(5px);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* Bottom gradient for depth */
        .bottom-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(to top, rgba(26, 15, 10, 0.9) 0%, transparent 100%);
        }
    </style>
</head>
<body>
    <div class="thumbnail">
        <div class="sun-glow"></div>
        
        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
        <div class="particle p5"></div>
        
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
        
        <div class="music-element music-1">🎷</div>
        <div class="music-element music-2">☕</div>
        <div class="music-element music-3">🎵</div>
        
        <div class="cup-container">
            <div class="steam-group">
                <div class="steam-line"></div>
                <div class="steam-line"></div>
                <div class="steam-line"></div>
                <div class="steam-line"></div>
            </div>
            <div class="cup-main">
                <div class="cup-handle"></div>
                <div class="cup-body">
                    <div class="coffee-surface"></div>
                    <div class="cup-reflection"></div>
                </div>
            </div>
            <div class="saucer"></div>
        </div>
        
        <div class="title">
            <h1>下午茶<br>時光</h1>
            <div class="subtitle">JAZZ · RELAX</div>
        </div>
        
        <div class="tags">
            <div class="tag">☕ CAFE</div>
            <div class="tag gold">🎷 JAZZ</div>
        </div>
        
        <div class="ai-badge">AI MUSIC</div>
        
        <div class="play-hint">▶</div>
        
        <div class="bottom-gradient"></div>
    </div>
</body>
</html>
