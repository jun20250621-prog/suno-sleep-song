<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Thumbnail - Night Stars</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Microsoft JhengHei', 'Arial Black', sans-serif;
        }

        .thumbnail {
            width: 1280px;
            height: 720px;
            background: linear-gradient(180deg, #0f0c29 0%, #302b63 40%, #24243e 70%, #1a1a2e 100%);
            position: relative;
            overflow: hidden;
        }

        /* Background stars */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }

        .star:nth-child(1) { width: 4px; height: 4px; top: 15%; left: 10%; animation-delay: 0s; }
        .star:nth-child(2) { width: 3px; height: 3px; top: 25%; left: 25%; animation-delay: 0.3s; }
        .star:nth-child(3) { width: 5px; height: 5px; top: 10%; left: 45%; animation-delay: 0.6s; }
        .star:nth-child(4) { width: 3px; height: 3px; top: 30%; left: 60%; animation-delay: 0.9s; }
        .star:nth-child(5) { width: 4px; height: 4px; top: 18%; left: 78%; animation-delay: 1.2s; }
        .star:nth-child(6) { width: 6px; height: 6px; top: 8%; left: 90%; animation-delay: 1.5s; }
        .star:nth-child(7) { width: 3px; height: 3px; top: 35%; left: 15%; animation-delay: 0.4s; }
        .star:nth-child(8) { width: 4px; height: 4px; top: 22%; left: 85%; animation-delay: 0.8s; }

        @keyframes twinkle {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Moon - main focal point */
        .moon {
            position: absolute;
            top: 50px;
            right: 120px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle at 35% 35%, #fffef0 0%, #ffeaa7 30%, #fdcb6e 60%, #f39c12 100%);
            border-radius: 50%;
            box-shadow: 
                0 0 80px rgba(255, 234, 167, 0.8),
                0 0 150px rgba(255, 234, 167, 0.4),
                0 0 250px rgba(255, 234, 167, 0.2);
        }

        /* Moon craters */
        .moon::before {
            content: '';
            position: absolute;
            top: 40px;
            left: 50px;
            width: 30px;
            height: 30px;
            background: rgba(200, 180, 100, 0.3);
            border-radius: 50%;
        }

        .moon::after {
            content: '';
            position: absolute;
            top: 100px;
            left: 100px;
            width: 50px;
            height: 40px;
            background: rgba(200, 180, 100, 0.2);
            border-radius: 50%;
        }

        /* Glow behind moon */
        .moon-glow {
            position: absolute;
            top: 30px;
            right: 70px;
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(255, 234, 167, 0.3) 0%, transparent 70%);
            border-radius: 50%;
        }

        /* Main title - large and bold */
        .title {
            position: absolute;
            bottom: 180px;
            left: 60px;
            z-index: 10;
        }

        .title h1 {
            font-size: 120px;
            font-weight: 900;
            color: white;
            text-shadow: 
                4px 4px 0 #1a1a2e,
                -2px -2px 0 #1a1a2e,
                2px -2px 0 #1a1a2e,
                -2px 2px 0 #1a1a2e,
                0 8px 30px rgba(0, 0, 0, 0.8);
            letter-spacing: -2px;
            line-height: 1;
        }

        .title .subtitle {
            font-size: 36px;
            font-weight: bold;
            color: #ffeaa7;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 8px;
            margin-top: 10px;
        }

        /* Zzz - sleep symbol */
        .zzz {
            position: absolute;
            bottom: 200px;
            right: 350px;
            font-size: 80px;
            font-weight: bold;
            color: #74b9ff;
            text-shadow: 0 0 20px rgba(116, 185, 255, 0.8);
            animation: float 3s ease-in-out infinite;
        }

        .zzz::after {
            content: 'Z';
            font-size: 50px;
            margin-left: 5px;
            animation: float 3s ease-in-out infinite 0.5s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
            50% { transform: translateY(-20px) rotate(10deg); opacity: 1; }
        }

        /* Tags - bottom left */
        .tags {
            position: absolute;
            bottom: 60px;
            left: 60px;
            display: flex;
            gap: 15px;
        }

        .tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 12px 28px;
            border-radius: 30px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.5);
            letter-spacing: 1px;
        }

        .tag.white {
            background: white;
            color: #1a1a2e;
        }

        /* AI badge - bottom right */
        .ai-badge {
            position: absolute;
            bottom: 50px;
            right: 50px;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            padding: 15px 35px;
            border-radius: 30px;
            color: white;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            box-shadow: 0 6px 25px rgba(0, 210, 255, 0.5);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        /* Cloud silhouettes */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
        }

        .cloud-1 {
            width: 300px;
            height: 80px;
            bottom: 0;
            left: -50px;
        }

        .cloud-2 {
            width: 250px;
            height: 60px;
            bottom: 20px;
            right: -30px;
        }

        /* YouTube red bar (signature) */
        .yt-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, #ff0000 0%, #cc0000 100%);
        }
    </style>
</head>
<body>
    <div class="thumbnail">
        <div class="stars">
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
        </div>
        
        <div class="moon-glow"></div>
        <div class="moon"></div>
        
        <div class="zzz">Z</div>
        
        <div class="title">
            <h1>夜枕星辰</h1>
            <div class="subtitle">SLEEP · MEDITATION</div>
        </div>
        
        <div class="tags">
            <div class="tag white">🎵 睡眠音樂</div>
            <div class="tag">🧘 靜心</div>
        </div>
        
        <div class="ai-badge">🤖 AI MUSIC</div>
        
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        
        <div class="yt-bar"></div>
    </div>
</body>
</html>
